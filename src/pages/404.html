<div class="not-found">
  <div class="not-found__message">
    <div class="not-found__text-block">
      <h1 class="not-found__title">{{notFound.title}}</h1>
      <h2 class="not-found__subtitle">{{notFound.message}}</h2>
    </div>
    <div class="not-found__illustration-wrapper">
      <img
        class="not-found__illustration"
        src="/public/photos/404.png"
        alt="404"
      />
    </div>
  </div>
  <button class="btn-primary" data-navigate="/">{{notFound.cta}}</button>
</div>
