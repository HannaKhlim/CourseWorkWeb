<section class="hero-banner">
  <img
    src="/public/photos/hero-image.png"
    alt="Hero Banner"
    class="hero-banner__img"
  />
</section>

<section class="genders">
  <div class="genders__item" onclick="navigateTo('/products?gender=women')">
    <span class="genders__label">{{home.women}}</span>
    <img
      src="./public/photos/woman.png"
      alt="{{home.women}}"
      class="genders__img"
    />
  </div>
  <div class="genders__item" onclick="navigateTo('/products?gender=men')">
    <span class="genders__label">{{home.men}}</span>
    <img
      src="./public/photos/man.png"
      alt="{{home.men}}"
      class="genders__img"
    />
  </div>
  <div class="genders__item" onclick="navigateTo('/products?gender=kids')">
    <span class="genders__label">{{home.kids}}</span>
    <img
      src="./public/photos/baby.png"
      alt="{{home.kids}}"
      class="genders__img"
    />
  </div>
</section>
