<section class="hero-banner">
  <div class="hero-banner_video-wrapper">
    <img
      src="./public/photos/hero-image.jpg"
      alt="Fashion Video Preview"
      class="hero-banner_img"
    />
    <button class="hero-banner_play-btn"></button>
  </div>
</section>

<section class="categories">
  <div class="categories_item">
    <img src="./public/photos/woman.png" alt="Женщины" class="categories_img" />
    <span class="categories_label">Женщины</span>
  </div>
  <div class="categories_item">
    <img src="./public/photos/man.png" alt="Мужчины" class="categories_img" />
    <span class="categories_label">Мужчины</span>
  </div>
  <div class="categories_item">
    <img src="./public/photos/baby.png" alt="Дети" class="categories_img" />
    <span class="categories_label">Дети</span>
  </div>
</section>

<section class="promo-section">
  <div class="promo-section_sale-card">
    <h2 class="promo-section_sale-title">-30%</h2>
    <p class="promo-section_sale-text">на аксессуары</p>
  </div>
  <div class="promo-section_carousel">
    <div class="promo-section_item">
      <img
        src="./public/photos/acc1.jpg"
        alt="Серьги"
        class="promo-section_img"
      />
    </div>
  </div>
</section>

<section class="new-arrivals">
  <div class="new-arrivals_header">
    <h2 class="new-arrivals_title">Новинки этой осени</h2>
    <div class="new-arrivals_tabs">
      <span class="new-arrivals_tab new-arrivals_tab--active"
        >Верхняя одежда</span
      >
      <span class="new-arrivals_tab">Трикотаж</span>
      <span class="new-arrivals_tab">Сапоги</span>
    </div>
  </div>

  <div class="product-grid">
    <article class="product-card">
      <div class="product-card_image-wrapper">
        <img
          src="./public/photos/skirt.jpg"
          alt="Юбка миди"
          class="product-card_img"
        />
        <button class="product-card_wishlist-btn"></button>
      </div>
      <div class="product-card_info">
        <h3 class="product-card_title">Юбка миди</h3>
        <p class="product-card_brand">LOVE REPUBLIC</p>
        <p class="product-card_price">3 400 ₽</p>
        <button class="product-card_buy-btn">Подробнее</button>
      </div>
    </article>
  </div>
</section>

<section class="about-us">
  <div class="about-us_container">
    <img
      src="./public/photos/about-bg.jpg"
      alt="О компании"
      class="about-us_img"
    />
    <div class="about-us_content">
      <h2 class="about-us_title">DEEPMAG</h2>
      <p class="about-us_description">
        Сеть магазинов мировых брендов ARMANI EXCHANGE, GANT...
      </p>
      <a href="#" class="about-us_link">Читать далее</a>
    </div>
  </div>
</section>

<section class="subscribe">
  <h2 class="subscribe_title">
    Подпишитесь на рассылку и получите скидку
    <span class="subscribe_accent">10%</span> на Ваш заказ
  </h2>
  <form class="subscribe_form">
    <input type="email" class="subscribe_input" placeholder="Ваш e-mail" />
    <button type="submit" class="subscribe_btn">ПОДПИСАТЬСЯ</button>
  </form>
</section>
