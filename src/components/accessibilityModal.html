<div class="accessibility-modal">
  <div class="accessibility-modal__backdrop"></div>
  <div class="accessibility-modal__panel">
    <div class="accessibility-modal__header">
      <h2 class="accessibility-modal__title">{{accessibility.title}}</h2>
      <img
        src="/public/icons/close.svg"
        alt="Close"
        class="accessibility-modal__close"
        id="accessibility-close"
      />
    </div>
    <div class="accessibility-modal__section">
      <h3 class="accessibility-modal__label">{{accessibility.fontSize}}</h3>
      <div class="accessibility-modal__options" id="a11y-font-size">
        <label class="accessibility-modal__option">
          <input
            class="radio"
            type="radio"
            name="a11y-font"
            value="normal"
            checked
          />
          <span class="accessibility-modal__option-text" style="font-size: 1em"
            >Aa</span
          >
        </label>
        <label class="accessibility-modal__option">
          <input class="radio" type="radio" name="a11y-font" value="large" />
          <span
            class="accessibility-modal__option-text"
            style="font-size: 1.2em"
            >Aa</span
          >
        </label>
        <label class="accessibility-modal__option">
          <input class="radio" type="radio" name="a11y-font" value="xlarge" />
          <span
            class="accessibility-modal__option-text"
            style="font-size: 1.5em"
            >Aa</span
          >
        </label>
      </div>
    </div>
    <div class="accessibility-modal__section">
      <h3 class="accessibility-modal__label">{{accessibility.colorScheme}}</h3>
      <div
        class="accessibility-modal__options accessibility-modal__options--schemes"
        id="a11y-color-scheme"
      >
        <label class="accessibility-modal__option">
          <input
            class="radio"
            type="radio"
            name="a11y-scheme"
            value="default"
            checked
          />
          <span
            class="accessibility-modal__swatch accessibility-modal__swatch--default"
            >Aa</span
          >
          <span class="accessibility-modal__option-text"
            >{{accessibility.schemeDefault}}</span
          >
        </label>
        <label class="accessibility-modal__option">
          <input
            class="radio"
            type="radio"
            name="a11y-scheme"
            value="black-white"
          />
          <span
            class="accessibility-modal__swatch accessibility-modal__swatch--black-white"
            >Aa</span
          >
          <span class="accessibility-modal__option-text"
            >{{accessibility.schemeBlackWhite}}</span
          >
        </label>
        <label class="accessibility-modal__option">
          <input
            class="radio"
            type="radio"
            name="a11y-scheme"
            value="black-green"
          />
          <span
            class="accessibility-modal__swatch accessibility-modal__swatch--black-green"
            >Aa</span
          >
          <span class="accessibility-modal__option-text"
            >{{accessibility.schemeBlackGreen}}</span
          >
        </label>
        <label class="accessibility-modal__option">
          <input
            class="radio"
            type="radio"
            name="a11y-scheme"
            value="white-black"
          />
          <span
            class="accessibility-modal__swatch accessibility-modal__swatch--white-black"
            >Aa</span
          >
          <span class="accessibility-modal__option-text"
            >{{accessibility.schemeWhiteBlack}}</span
          >
        </label>
        <label class="accessibility-modal__option">
          <input
            class="radio"
            type="radio"
            name="a11y-scheme"
            value="beige-brown"
          />
          <span
            class="accessibility-modal__swatch accessibility-modal__swatch--beige-brown"
            >Aa</span
          >
          <span class="accessibility-modal__option-text"
            >{{accessibility.schemeBeigeBrown}}</span
          >
        </label>
        <label class="accessibility-modal__option">
          <input
            class="radio"
            type="radio"
            name="a11y-scheme"
            value="blue-darkblue"
          />
          <span
            class="accessibility-modal__swatch accessibility-modal__swatch--blue-darkblue"
            >Aa</span
          >
          <span class="accessibility-modal__option-text"
            >{{accessibility.schemeBlueDarkblue}}</span
          >
        </label>
      </div>
    </div>
    <div class="accessibility-modal__section">
      <label class="accessibility-modal__option">
        <input class="checkbox" type="checkbox" id="a11y-images-toggle" />
        <span class="accessibility-modal__option-text"
          >{{accessibility.imagesLabel}}</span
        >
      </label>
    </div>
    <div class="accessibility-modal__actions">
      <button class="btn-secondary" id="accessibility-reset">
        {{accessibility.reset}}
      </button>
      <button class="btn-primary" id="accessibility-close-btn">
        {{accessibility.close}}
      </button>
    </div>
  </div>
</div>
