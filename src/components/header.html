<header class="header">
  <div class="header-top">
      <div class="header-top__item">
        <img
          src="/public/icons/e-mail.png"
          alt="Email"
          class="header-top__icon"
        />
        <span>support@deepmag.ru</span>
      </div>
      <div class="header-top__item">
        <img
          src="/public/icons/phone.png"
          alt="Phone"
          class="header-top__icon"
        />
        <span>+7 (919)-123-456-56</span>
      </div>
      <div class="header-top__item">
        <img
          src="/public/icons/whatsapp.png"
          alt="WhatsApp"
          class="header-top__icon"
        />
        <span>Напишите нам в WhatsApp</span>
      </div>
      <div class="header-top__item">
        <img src="/public/icons/sparkles.svg" alt="Change Theme" class="header-top__icon" />
        <button class="header-top__cta">Сменить тему</button>
      </div>
      <div class="header-top__item">
        <img src="/public/icons/vision.png" alt="Vision Support" class="header-top__icon" />
        <button class="header-top__cta">Слабовидящим</button>
      </div>
      <div class="header-top__item">
        <img src="/public/icons/translation.png" alt="Change Language" class="header-top__icon" />
        <button class="header-top__cta">Сменить язык</button>
      </div>
    <div class="header-top__item">
      <img src="/public/icons/mask.png" alt="Delivery" class="header-top__icon" />
      <span>Бесконтактная доставка</span>
    </div>
  </div>
  <div class="header-bottom">
    <div class="header-bottom__item">
      <img
        src="/public/logos/logo.png"
        alt="DEEPMAG"
        class="header-bottom__logo"
      />
    </div>
    <div class="header-bottom__item header-search__wrapper">
      <input type="text" class="header-search" placeholder="Поиск" />
    </div>
    <div class="header-bottom__item header-profile">
      <div class="header-profile__item">
        <span>Вход/регистрация</span>
        <img src="/public/icons/enter.svg" alt="Login" class="header-profile__icon" />
      </div>
      <div class="header-profile__item">
        <img src="/public/icons/heart.png" alt="Favorites" class="header-profile__icon" />
      </div>
      <div class="header-profile__item">
        <img src="/public/icons/cart.svg" alt="Cart" class="header-profile__icon" />
      </div>
    </div>
  </div>
</header>
